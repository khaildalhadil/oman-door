  </g>

  <!-- masts and yards -->
  <g stroke="#4a2c14" stroke-linecap="round">
    <line x1="430" y1="352" x2="410" y2="70" stroke-width="9"/>
    <line x1="250" y1="340" x2="238" y2="140" stroke-width="7"/>
    <line x1="640" y1="250" x2="215" y2="58" stroke-width="6"/>
    <line x1="420" y1="210" x2="150" y2="118" stroke-width="5"/>
  </g>
  <!-- lateen sails -->
  <path d="M632 252 L222 64 Q300 210 330 336 Q470 300 632 252 Z" fill="url(#sail)" stroke="#8a7350" stroke-width="3"/>
  <path d="M414 212 L156 122 Q196 220 214 326 Q320 290 414 212 Z" fill="url(#sail)" stroke="#8a7350" stroke-width="3"/>
  <g stroke="#b9a37a" stroke-width="2" opacity="0.7">
    <path d="M300 100 Q340 210 360 320 M380 136 Q410 220 430 300 M460 172 Q490 230 510 286"/>
    <path d="M200 150 Q226 230 238 310 M270 172 Q290 230 300 296"/>
  </g>
  <!-- rigging -->
  <g stroke="#4a2c14" stroke-width="2" opacity="0.8">
    <line x1="410" y1="74" x2="660" y2="330"/><line x1="410" y1="74" x2="300" y2="352"/>
    <line x1="238" y1="144" x2="150" y2="352"/>
  </g>

  <!-- hull: long raked bow on the right, tall square carved stern on the left -->
  <path d="M120 300 L150 300 L162 352 L640 340 Q700 322 742 286 L752 292 Q716 360 640 396 L210 404 Q150 400 132 384 Z" fill="url(#hull)" stroke="#3f2410" stroke-width="4" stroke-linejoin="round"/>
