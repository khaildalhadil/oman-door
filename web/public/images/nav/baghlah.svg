  <path d="M112 236 L202 242" stroke="#3f2410" stroke-width="7" stroke-linecap="round"/>
  <g fill="#f3d58a" stroke="#3f2410" stroke-width="2.5">
    <rect x="138" y="262" width="16" height="20" rx="7"/><rect x="164" y="264" width="16" height="20" rx="7"/>
    <rect x="140" y="296" width="14" height="16" rx="6"/><rect x="164" y="298" width="14" height="16" rx="6"/>
  </g>
  <path d="M162 362 L690 346" stroke="#e8c27a" stroke-width="5"/>
  <path d="M170 378 L640 368" stroke="#3f2410" stroke-width="2" opacity="0.6"/>
  <g fill="#3f2410">
    <circle cx="260" cy="356" r="4"/><circle cx="330" cy="355" r="4"/><circle cx="400" cy="353" r="4"/><circle cx="470" cy="351" r="4"/><circle cx="540" cy="349" r="4"/>
  </g>
  <path d="M120 404 Q300 418 460 410 Q620 404 720 380" stroke="#ffffff" stroke-opacity="0.45" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
