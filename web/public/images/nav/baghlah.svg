<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="سفينة عُمانية تقليدية">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e2bf"/>
      <stop offset="1" stop-color="#f8eedb"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8a96"/>
      <stop offset="1" stop-color="#1b5563"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9783f"/>
      <stop offset="1" stop-color="#6e3f1d"/>
    </linearGradient>
    <linearGradient id="sail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#e9dcc0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#sky)"/>
  <circle cx="640" cy="110" r="46" fill="#f6d79a" opacity="0.8"/>
  <path d="M0 360 Q60 336 120 346 Q150 330 190 344 L190 368 L0 368 Z" fill="#a8956a"/>
  <g fill="#5d6b3a"><path d="M70 344 q4 -40 2 -56 M70 290 q-18 -4 -30 6 M72 290 q20 -6 30 4 M71 292 q-6 -16 -22 -20 M72 292 q8 -16 24 -18" stroke="#5d6b3a" stroke-width="5" fill="none" stroke-linecap="round"/></g>
  <rect y="362" width="800" height="158" fill="url(#sea)"/>
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
    <path d="M60 400 h40 M220 430 h60 M520 410 h50 M650 450 h70 M120 470 h50 M380 490 h60 M700 395 h40"/>
  </g>
  <g stroke="#3a2a1a" stroke-width="3" fill="none" stroke-linecap="round">
